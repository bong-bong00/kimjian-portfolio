:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

  --blue:#6A93FF; --blue-ink:#8DADFF; --alkong:#5B74FF; --jobmoa:#9B82FC; --cheonha:#DB7A55;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 16px 40px -18px rgba(0,0,0,.6); --shadow-up:0 2px 6px rgba(0,0,0,.35),0 26px 50px -20px rgba(0,0,0,.75); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--f);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.012em;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

.backdrop{position:absolute;inset:-20px 0 0 24%;display:flex;flex-direction:column;justify-content:center;gap:0;pointer-events:none;user-select:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 86%,transparent 100%)}
.track{display:flex;width:max-content}
/* 원색 표지가 흰 바탕에 딱 잘려 보이지 않도록 가장자리를 바탕으로 풀어준다 */
.track div{width:clamp(320px,32vw,480px);aspect-ratio:16/9;flex:none;margin:14px 22px 14px 0;border-radius:20px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(20,25,34,.35)}
.track img{width:100%;height:100%;object-fit:cover;display:block}
.track.t2{margin-left:-240px}
@media (prefers-reduced-motion:no-preference){

}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;

.sec{padding-block:96px;scroll-margin-top:64px}

/* 프로젝트 */
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:30px;row-gap:48px}
.proj{display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0}
.cover{aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--gray);box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.8,.25,1),box-shadow .35s ease}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
a.proj:hover .cover,a.proj:focus-visible .cover{transform:translateY(-8px)}
a.proj:hover .cover,a.proj:focus-visible .cover{box-shadow:var(--shadow-up)}
.pi{padding:16px 4px 0}
.pi .nm{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.03em}
.pi .nm .app{width:30px;height:30px}
.pi p{margin-top:8px;font-size:14.5px;color:var(--sub);line-height:1.55}
.pi .m{display:block;margin-top:8px;font-size:13px;color:var(--muted);font-weight:500}
.pi .go{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:700;color:var(--blue-ink)}
.pi .go.off{color:var(--muted)}

/* Portfolio refinement */
.project-heading{flex-wrap:wrap;gap:12px 16px}
.project-hint{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:-.015em;margin-left:4px}
#projects{position:relative}
#projects::before{content:"";position:absolute;right:0;top:110px;width:260px;height:260px;background:radial-gradient(circle,color-mix(in srgb,var(--blue) 7%,transparent),transparent 70%);pointer-events:none;z-index:-1}
.projects{position:relative}
.proj{padding:0 0 8px}
.cover{border-radius:24px;outline:1px solid color-mix(in srgb,var(--line) 70%,transparent);outline-offset:-1px;box-shadow:0 10px 32px -18px rgba(20,25,34,.24)}
.cover img{transition:transform .5s cubic-bezier(.2,.8,.25,1)}
a.proj:hover .cover img,a.proj:focus-visible .cover img{transform:scale(1.025)}
.pi{padding:20px 6px 0}
.pi .nm{font-size:21px}
.pi p{font-size:15px;line-height:1.7;margin-top:10px}
.pi .m{margin-top:10px}
.nav{border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.way{border:1px solid var(--line);box-shadow:0 8px 28px -22px rgba(20,25,34,.18)}
.tool{border:1px solid var(--line);background:color-mix(in srgb,var(--gray) 85%,var(--card))}
.tool .chips span{border:1px solid var(--line)}
@media(max-width:560px){.project-hint{flex-basis:100%;margin-left:0;padding-left:0;font-size:12px}.projects{row-gap:32px}}
/* 도구 */
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tool{background:var(--gray);border-radius:24px;padding:28px;min-width:0}
.tool h3{font-size:19px;font-weight:800}
.tool .chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 16px}
.tool .chips span{font-size:13.5px;font-weight:700;padding:7px 11px;border-radius:10px;background:var(--card)}
.tool p{font-size:15px;color:var(--sub);line-height:1.7}

/* 수상·학력 */
.exp{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.timeline{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:10px 28px}
.ti{display:grid;grid-template-columns:90px minmax(0,1fr);gap:18px;padding:20px 0;border-top:1px solid var(--line)}
.ti:first-child{border-top:0}
.ti time{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.ti b{display:block;font-size:16px;font-weight:700;line-height:1.5}
.pt{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:8px;background:var(--c);color:var(--on)}
.pt .app{width:18px;height:18px;border-radius:5px;box-shadow:none}
.pt.etc{background:var(--gray);color:var(--sub)}
.edu{display:grid;gap:14px}
.edu-h{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:0 0 2px}
.edu-h .badge{width:44px;height:44px;border-radius:14px}.edu-h .badge img{width:28px;height:28px}
.edu div.e{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:24px 26px}
.edu time{font-size:13.5px;color:var(--muted);font-weight:600}
.edu b{display:block;font-size:19px;font-weight:800;margin-top:6px}
.edu span{color:var(--sub);font-size:15px}

footer{padding-block:40px calc(40px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:flex-end}
footer a{text-decoration:none}

@media (max-width:1000px){
  .projects{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:40px}
  .ways,.tools{grid-template-columns:1fr}
  .exp{grid-template-columns:1fr}
}
@media (max-width:760px){
  .backdrop{inset:-40px -30% -20px -10%}

  .hero .wrap{padding-block:80px 72px}
  .nav nav{display:none}

@media (max-width:560px){

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.proj,.cover{transition:none}}
